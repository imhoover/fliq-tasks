<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eeedf7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Fliq タスクとメモ" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Fliq — タスクとメモ</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eeedf7;
        color: #292939;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #boot {
        min-height: 100dvh;
        padding: 32px max(24px, calc((100vw - 1040px) / 2));
        background:
          radial-gradient(ellipse at 85% 15%, #dedaf5, transparent 65%), #eeedf7;
      }
      .boot-top {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 58px;
      }
      .boot-logo {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -2px;
      }
      .bone {
        background: #d5d4e4;
        border-radius: 10px;
        position: relative;
        overflow: hidden;
      }
      .bone:after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, #ffffff75, transparent);
        animation: shimmer 1.4s linear infinite;
      }
      @keyframes shimmer {
        to {
          transform: translateX(100%);
        }
      }
      .boot-line {
        height: 20px;
        width: 150px;
        margin-bottom: 20px;
      }
      .boot-row {
        height: 80px;
        margin-top: 12px;
        opacity: 0.6;
      }
      .boot-composer {
        background: #ffffffb8;
        border: 1px solid white;
        border-radius: 24px;
        padding: 22px;
        margin: 0 0 38px;
        box-shadow: 0 12px 48px #6158880b;
      }
      #boot-input {
        font: inherit;
        font-size: 17px;
        line-height: 1.7;
        width: 100%;
        min-height: 94px;
        resize: vertical;
        border: 0;
        outline: 0;
        background: transparent;
        color: inherit;
      }
      #boot-input:focus-visible {
        outline: 2px solid #7773d4;
        outline-offset: 8px;
        border-radius: 4px;
      }
      .boot-caption {
        margin-top: 12px;
        font-size: 12px;
        color: #66677a;
      }
      @media (prefers-reduced-motion: reduce) {
        .bone:after {
          animation: none;
        }
      }
      @media (max-width: 600px) {
        #boot {
          padding: 24px 20px;
        }
        .boot-top {
          margin-bottom: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="読み込み中">
        <div class="boot-top">
          <span class="boot-logo"
            >fliq<span style="color: #7773d4">.</span></span
          >
        </div>
        <div class="bone boot-line"></div>
        <div class="boot-composer">
          <textarea
            id="boot-input"
            aria-label="メモ、タスクを入力"
            placeholder="メモ、タスクを入力…"
            maxlength="5300"
          ></textarea>
          <div class="boot-caption" id="boot-state">下書き</div>
        </div>
        <div class="bone boot-line" style="width: 110px"></div>
        <div class="bone boot-row"></div>
        <div class="bone boot-row"></div>
        <div class="bone boot-row"></div>
      </div>
    </div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
